name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::Missing Actions secret VPS_HOST"; exit 1; }
          test -n "$VPS_USERNAME" || { echo "::error::Missing Actions secret VPS_USERNAME"; exit 1; }
          test -n "$VPS_PASSWORD" || { echo "::error::Missing Actions secret VPS_PASSWORD"; exit 1; }
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -eu
            if [ ! -d /opt/fact-checker-backend/.git ]; then
              git clone https://github.com/duyanh-se/fast-checker-backend.git /opt/fact-checker-backend
            fi
            cd /opt/fact-checker-backend
            git fetch origin main
            git reset --hard origin/main
            test -f .env
            docker compose up -d --build --remove-orphans
            cp deploy/nginx.fact-checker.conf /etc/nginx/sites-available/fact-checker.conf
            ln -sfn /etc/nginx/sites-available/fact-checker.conf /etc/nginx/sites-enabled/fact-checker.conf
            nginx -t
            systemctl reload nginx
